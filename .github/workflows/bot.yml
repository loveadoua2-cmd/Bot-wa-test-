name: WhatsApp Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Restaurer la session
        uses: actions/cache@v3
        with:
          path: ./auth
          key: wa-session-${{ github.run_id }}
          restore-keys: |
            wa-session-
      
      - name: Installer les dépendances
        run: npm install
      
      - name: Lancer le bot
        run: node index.js
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
